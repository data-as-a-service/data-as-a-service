<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schema library · DaaS Studio</title><link rel="stylesheet" href="workspace.css"></head>
<body><header><a href="index.html">DaaS Studio</a><span>API workspace</span></header>
<main><h1>Schema library</h1><p>Create a definition or generate ten sample records from a saved schema.</p>
<p id="message" role="status"></p><div class="workspace">
<section><h2>Saved schemas</h2><div id="schemas" aria-live="polite">Loading schemas…</div></section>
<section><h2>New schema</h2><form id="create"><fieldset><label>Schema name<input id="schemaName" maxlength="120" placeholder="e.g. Customer" required></label>
<div id="fieldsContainer"></div><button type="button" id="addField">Add field</button><button class="primary">Save schema</button></fieldset></form></section></div>
<section id="response" hidden><h2>JSON response</h2><pre id="generatedData" tabindex="0"></pre></section>
<template id="field"><div class="field"><label>Field name<input class="fieldName" maxlength="120" required></label><label>Type<select class="fieldType"><option value="0">Integer</option><option value="1">Float</option><option value="2">Boolean</option><option value="3">String</option><option value="4">Character</option><option value="5">GUID</option><option value="6">Date</option><option value="7">Double</option></select></label></div></template>
</main><script src="Script.js" defer></script></body></html>
