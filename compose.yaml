services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: "8080"
    env_file:
      - path: .env
        required: false

  frontend:
    build:
      context: ./src/frontend/daas-client
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "127.0.0.1:8088:80"
