services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${DAAS_CONNECTION_STRING:?Set DAAS_CONNECTION_STRING in .env (see .env.example)}
    ports:
      - "127.0.0.1:5247:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/swagger/v1/swagger.json || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --strictPort"
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./src/frontend/daas-client:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  frontend_node_modules:
